name: e2e

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 0 * * *'

jobs:
  e2e-webman:
    runs-on: ubuntu-latest

    name: webman E2E

    env:
      COMPOSER_ROOT_VERSION: dev-main

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pcntl, posix, pdo_sqlite
          tools: composer:v2

      # 不缓存 e2e/webman（可抛弃的生成目录，缓存收益低且易脏）

      - name: Install root dependencies
        run: composer install --no-interaction --no-progress

      - name: Setup webman e2e app
        run: vendor/bin/e2e-setup install webman

      - name: Run e2e tests
        run: vendor/bin/pest
        working-directory: e2e/webman

  e2e-laravel:
    runs-on: ubuntu-latest

    name: laravel E2E

    env:
      COMPOSER_ROOT_VERSION: dev-main

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo_sqlite
          tools: composer:v2

      # 不缓存 e2e/laravel（可抛弃的生成目录）

      - name: Install root dependencies
        run: composer install --no-interaction --no-progress

      - name: Setup laravel e2e app
        run: vendor/bin/e2e-setup install laravel

      - name: Run e2e tests
        run: vendor/bin/pest
        working-directory: e2e/laravel
